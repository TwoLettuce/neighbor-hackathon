services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-networking_events}
      POSTGRES_USER: ${POSTGRES_USER:-networking}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-networking}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-networking} -d ${POSTGRES_DB:-networking_events}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
